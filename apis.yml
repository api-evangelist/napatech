name: Napatech
description: >-
  Napatech is a Danish provider of programmable FPGA-based SmartNICs and
  network-acceleration hardware used for high-speed network monitoring,
  cybersecurity, and telecom/5G workloads. Its Link-Capture and Link-Inline
  software, together with the NTAPI/NTPL developer SDK, let applications capture,
  filter, and process network traffic at line rate with zero packet loss. The
  developer surface is a C/C++ hardware SDK (NTAPI) plus the NTPL programming
  language rather than a web/REST API; integrations ship as open-source additions
  to DPDK, VPP, Open vSwitch, Scapy, and Zeek via the napatech GitHub
  organization. Surfaced as a portfolio company of Northzone and enriched by the
  API Evangelist pipeline.
