notes: >-
  Napatech ships no client SDK in a public language package registry (npm, PyPI,
  Maven, NuGet, crates.io, RubyGems, Packagist, pkg.go.dev). Its primary developer
  surface is the NTAPI/NTPL C/C++ SDK bundled with the SmartNIC driver software
  (downloaded from the Napatech support portal, not a registry). What Napatech
  publishes openly are first-party source integrations / additions to popular
  network-processing frameworks on its GitHub org. Those are catalogued below as
  source packages (registry: github); none are installable via a package manager,
  so no `SDKs` rating pointer is emitted.
packages:
