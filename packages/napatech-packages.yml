    registry: github
    name: napatech/ntapi_examples
    url: https://github.com/napatech/ntapi_examples
    install: git clone https://github.com/napatech/ntapi_examples
    description: Collection of NTPL code examples for the Napatech NTAPI SDK.
    official: true
